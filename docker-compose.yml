version: '3.8'

services:
  # AI-Kline MCP 服务
  ai-kline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-kline-mcp
    ports:
      - "20020:8000"  # MCP 服务端口
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - MPLBACKEND=Agg
      - PYTHONPATH=/app
      # MinIO 配置
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=ai-kline-charts
      # MinIO 外部访问地址（返回给用户的 URL）
      - MINIO_EXTERNAL_ENDPOINT=localhost
      - MINIO_EXTERNAL_PORT=20021
      # AI 模型配置（从 .env 文件读取）
      - AI_KLINE_API_KEY=${AI_KLINE_API_KEY}
      - AI_KLINE_BASE_URL=${AI_KLINE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - AI_KLINE_MODEL_NAME=${AI_KLINE_MODEL_NAME:-qwen-vl-max}
    volumes:
      - ./output:/app/output  # 输出目录挂载
      - ./logs:/app/logs      # 日志目录挂载
    depends_on:
      - minio
    networks:
      - ai-kline-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: ai-kline-minio
    ports:
      - "20021:9000"  # MinIO API 端口
      - "20022:9001"  # MinIO 控制台端口
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - ai-kline-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # AI-Kline Web 应用（可选）
  ai-kline-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-kline-web
    ports:
      - "20023:5000"  # Web 应用端口
    environment:
      - FLASK_ENV=production
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - MPLBACKEND=Agg
      - PYTHONPATH=/app
      # MinIO 配置
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=ai-kline-charts
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
      - ./static:/app/static
      - ./templates:/app/templates
    depends_on:
      - minio
      - ai-kline
    networks:
      - ai-kline-network
    restart: unless-stopped
    profiles:
      - web  # 使用 profile 控制是否启动

  # Nginx 反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: ai-kline-nginx
    ports:
      - "20024:80"
      - "20025:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # SSL 证书目录
    depends_on:
      - ai-kline
      - ai-kline-web
      - minio
    networks:
      - ai-kline-network
    restart: unless-stopped
    profiles:
      - nginx  # 使用 profile 控制是否启动

volumes:
  minio-data:
    driver: local

networks:
  ai-kline-network:
    driver: bridge

